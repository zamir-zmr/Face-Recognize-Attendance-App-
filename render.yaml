services:
  - type: web
    name: face-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install --no-deps mediapipe==0.10.14 && python download_models.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: CV_THREADS
        value: "1"
      - key: WEB_CONCURRENCY      # >1 is safe now: sessions in Redis, embeddings in Postgres
        value: "1"
      - key: CORS_ORIGINS
        sync: false               # e.g. https://your-app.vercel.app (not needed if UI is served from this service)
      - key: FACE_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: face-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: face-db
          property: connectionString

  - type: keyvalue
    name: face-redis
    plan: free
    maxmemoryPolicy: volatile-lru
    ipAllowList: []               # internal connections only

databases:
  - name: face-db
    plan: free                    # Render free Postgres expires after 30 days -> use a paid plan for real deployment
    
